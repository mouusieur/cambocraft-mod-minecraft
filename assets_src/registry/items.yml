# Catalogue des objets de Cambocraft (hors blocs) — source de vérité du registre.
#
# Champs :
#   id, fr, en    identifiant et noms localisés
#   max_count     taille de pile (64 par défaut)
#   food          composant alimentaire (classe utilitaire écrite à la main, voir PLUS_BAS)
#   rarity        common | uncommon | rare | epic
#   held          true pour un modèle tenu en main (outils, armes)
#   class         classe Java à instancier (par défaut Item)
#   texture       nom de texture (par défaut l'identifiant)
#
# Les objets fonctionnels (bol de riz béni, carnet, semences, pièces…) sont décrits ici ;
# leur comportement est codé dans les paquets craft/, power/, quest/ et documenté.

