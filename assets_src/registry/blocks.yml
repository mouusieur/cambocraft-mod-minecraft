# Catalogue des blocs de Cambocraft — source de vérité du registre.
#
# Chaque bloc décrit ici produit : un champ Java dans CamboBlocks, un blockstate, un ou
# plusieurs modèles, une table de butin, un nom en français et en anglais, et son entrée
# dans les balises d'outils (mineable/*, needs_*_tool).
#
# Exécution : python3 tools/gen_registry.py
# Contrôle   : python3 tools/validate.py  (vérifie la cohérence Java / JSON / textures)
#
# Champs d'un bloc :
#   id, fr, en      identifiant (espace de noms cambocraft) et noms localisés
#   mat             matière de texture (doit exister dans « textures » ci-dessous)
#   model           cube_all | cube_bottom_top | cube_column | cross | slab | stairs | wall
#                   | fence | fence_gate | carpet
#   hardness, resistance, tool (pickaxe|axe|shovel|hoe|shears|none), level (stone|iron|diamond)
#   sound, color    sonorité et couleur de carte (voir SONS/COULEURS dans gen_registry.py)
#   luminance       lumière émise 0-15
#   drops           self (défaut) | nothing | identifiant complet d'un autre objet
#   item            false pour un bloc sans objet d'inventaire
#   comment         commentaire repris dans le Java
#
# Les palettes de couleurs sont documentées dans docs/PALETTES.md.

