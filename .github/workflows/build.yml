name: build

# Compile le mod avec Gradle / Fabric Loom, vérifie le contenu du .jar,
# publie le .jar en artefact et l'attache à la release GitHub.
# Les runners GitHub ont accès à maven.fabricmc.net et aux dépôts Mojang,
# ce dont l'environnement de développement hors ligne ne dispose pas.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Compiler le mod
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Vérifier le contenu du .jar
        id: verify
        if: steps.gradle.outputs.code == '0'
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/verify.log" 2>&1
          import glob, json, zipfile, os, sys
          jars = [p for p in glob.glob("build/libs/*.jar") if "sources" not in p]
          assert len(jars) == 1, f"jars trouvés : {jars}"
          jar = jars[0]
          print("Fichier :", jar, f"({os.path.getsize(jar)} octets)")
          z = zipfile.ZipFile(jar)
          bad = z.testzip()
          print("Intégrité zip :", "OK" if bad is None else f"CORROMPU ({bad})")
          names = z.namelist()
          print("Entrées :", len(names))
          classes = [n for n in names if n.endswith(".class")]
          print("Classes .class :", len(classes))
          print("  dont com/cambocraft :", len([c for c in classes if c.startswith("com/cambocraft/")]))
          print("  dont net/minecraft (ne doit pas apparaître) :", len([c for c in classes if c.startswith("net/minecraft/")]))
          print("Assets :", len([n for n in names if n.startswith("assets/")]))
          print("Data   :", len([n for n in names if n.startswith("data/")]))
          meta = json.loads(z.read("fabric.mod.json"))
          print("fabric.mod.json : id =", meta["id"], "| version =", meta["version"])
          print("  entrypoints :", ", ".join(f"{k}={v}" for k, v in meta["entrypoints"].items()))
          print("  depends :", meta["depends"])
          must = ["com/cambocraft/Cambocraft.class", "com/cambocraft/client/CambocraftClient.class",
                  "assets/cambocraft/icon.png"]
          for m in must:
              print(("  présent  " if m in names else "  MANQUANT ") + m)
          pngs = [n for n in names if n.endswith(".png")]
          oggs = [n for n in names if n.endswith(".ogg")]
          jsons = [n for n in names if n.endswith(".json")]
          print(f"Bilan médias : {len(pngs)} PNG, {len(oggs)} OGG, {len(jsons)} JSON")
          # Les textures attendues par chaque modèle d'objet doit exister.
          modeles = [n for n in jsons if n.startswith("assets/cambocraft/models/")]
          attributs = [n for n in jsons if n.startswith("assets/cambocraft/blockstates/")]
          print(f"Modèles : {len(modeles)} | blockstates : {len(attributs)}")

          # Remapping : Loom doit avoir traduit les noms Yarn vers l'intermédiaire.
          # En production le jeu tourne en intermédiaire : toute référence Yarn
          # (net/minecraft/world/World, net/minecraft/item/Item...) ne serait pas résolue.
          # On ne regarde QUE les entrées CONSTANT_Class et les descripteurs réellement
          # utilisés au linkage : les signatures et noms de variables locales peuvent
          # légitimement contenir des noms Yarn sans conséquence à l'exécution.
          import re, struct
          def constantes(data):
              """Retourne (noms de classes CONSTANT_Class, descripteurs NameAndType)."""
              n = struct.unpack(">H", data[8:10])[0]
              pos, utf8, classes, descs, i = 10, {}, [], [], 1
              refs = {}
              while i < n:
                  tag = data[pos]; pos += 1
                  if tag == 1:
                      ln = struct.unpack(">H", data[pos:pos+2])[0]; pos += 2
                      utf8[i] = data[pos:pos+ln].decode("utf-8", "replace"); pos += ln
                  elif tag == 7:
                      refs[i] = ("class", struct.unpack(">H", data[pos:pos+2])[0]); pos += 2
                  elif tag in (8, 16, 19, 20):
                      pos += 2
                  elif tag == 12:
                      refs[i] = ("nat", struct.unpack(">HH", data[pos:pos+4])); pos += 4
                  elif tag in (9, 10, 11, 17, 18):
                      pos += 4
                  elif tag in (3, 4):
                      pos += 4
                  elif tag in (5, 6):
                      pos += 8; i += 1
                  elif tag == 15:
                      pos += 3
                  i += 1
              for kind, val in refs.values():
                  if kind == "class":
                      classes.append(utf8.get(val, ""))
                  else:
                      name_i, desc_i = val
                      descs.append(utf8.get(desc_i, ""))
              return classes, descs

          # Ces classes ne sont pas obfusquées dans Minecraft (pas de nom intermédiaire) :
          # elles gardent leur nom Yarn en production. Liste figée pour 1.21.1.
          NON_OBFUSQUEES = {
              "net/minecraft/server/MinecraftServer",
              "net/minecraft/server/Main",
              "net/minecraft/client/main/Main",
              "net/minecraft/client/ClientBrandRetriever",
              "net/minecraft/data/Main",
              "net/minecraft/obfuscate/DontObfuscate",
              "net/minecraft/util/profiling/jfr/event/ChunkGenerationEvent",
              "net/minecraft/util/profiling/jfr/event/NetworkSummaryEvent",
              "net/minecraft/util/profiling/jfr/event/ServerTickTimeEvent",
          }
          inter = named = 0
          exemples = []
          for c in classes:
              noms, descs = constantes(z.read(c))
              for ref in noms:
                  if not ref.startswith("net/minecraft/") or ref in NON_OBFUSQUEES:
                      continue
                  if re.search(r"class_\d+|field_\d+|method_\d+", ref):
                      inter += 1
                  elif re.match(r"net/minecraft/[a-z]", ref):
                      named += 1
                      if len(exemples) < 8: exemples.append(f"{c} : CONSTANT_Class {ref}")
              for d in descs:
                  for ref in re.findall(r"net/minecraft/[A-Za-z0-9_/$]+", d):
                      if ref in NON_OBFUSQUEES:
                          continue
                      if re.search(r"class_\d+", ref):
                          inter += 1
                      elif re.match(r"net/minecraft/[a-z]", ref):
                          named += 1
                          if len(exemples) < 8: exemples.append(f"{c} : descripteur {d}")
          print(f"Références intermédiaires : {inter} | références Yarn non remappées : {named}")
          if exemples: print("  exemples non remappés :", exemples)
          version_majeure = struct.unpack(">H", z.read(classes[0])[6:8])[0]
          print(f"Version de classe Java : {version_majeure} (65 = Java 21)")
          print("RÉSULTAT :", "OK" if bad is None and len(classes) >= 100 and named == 0
                and version_majeure == 65 else "ANOMALIE")
          PY
          cat "$RUNNER_TEMP/verify.log"

      - name: Publier le journal de compilation (check run)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.gradle.outputs.code }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          parts = []
          for nom in ("gradle.log", "verify.log"):
              p = os.path.join(os.environ["RUNNER_TEMP"], nom)
              if os.path.exists(p):
                  parts.append("=== " + nom + " ===\n" + open(p, encoding="utf-8", errors="replace").read())
          text = "\n".join(parts) or "(aucun journal)"
          text = text[-55000:]
          ok = os.environ.get("RESULT", "0") == "0"
          body = {
              "name": "cambocraft-build-log",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "success" if ok else "failure",
              "output": {
                  "title": "Journal Gradle et vérification du jar" + ("" if ok else " — échec"),
                  "summary": "Compilation du mod Cambocraft et contrôle du contenu du .jar.",
                  "text": "```\n" + text + "\n```",
              },
          }
          open("body.json", "w", encoding="utf-8").write(json.dumps(body))
          subprocess.run(["gh", "api", "-X", "POST",
                          "repos/" + os.environ["GITHUB_REPOSITORY"] + "/check-runs",
                          "--input", "body.json"], check=False)
          PY

      - name: Publier le .jar (artefact de build)
        if: steps.gradle.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cambocraft-jar
          path: build/libs/*.jar

      - name: Publier la release téléchargeable
        if: steps.gradle.outputs.code == '0' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Cambocraft 1.0.0 — Minecraft 1.21.1 (Fabric)
          body: |
            **Cambocraft 1.0.0** pour Minecraft **1.21.1** (Fabric).

            ### Installation
            1. Installe **Fabric Loader 0.16.14** (ou plus récent) pour Minecraft 1.21.1.
            2. Télécharge le `.jar` ci-dessous et place-le dans le dossier `mods/` de ton instance.
            3. Installe **Fabric API 0.116.18+1.21.1** dans le même dossier `mods/`.
            4. Lance le jeu ; la dimension `cambocraft:cambodia` s'ouvre via le **Portail du Lotus**.
          files: build/libs/cambocraft-1.0.0.jar
          fail_on_unmatched_files: true

      - name: Liste des fichiers produits
        if: always()
        run: ls -la build/libs 2>/dev/null || true

  # Démarre un vrai serveur Minecraft 1.21.1 + Fabric Loader avec le jar produit,
  # puis vérifie dans les journaux que le mod s'initialise sans crash.
  serveur:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Récupérer le jar compilé
        uses: actions/download-artifact@v4
        with:
          name: cambocraft-jar
          path: mods

      - name: Préparer le serveur Fabric
        id: prep
        continue-on-error: true
        run: |
          set -x
          # URL de l'installeur Fabric (toujours la dernière version stable).
          curl -fsSL -o fabric-installer.jar https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.1/fabric-installer-1.0.1.jar || exit 1
          mkdir -p serveur
          cd serveur
          java -jar ../fabric-installer.jar server -mcversion 1.21.1 -downloadMinecraft -dir . || exit 1
          echo "eula=true" > eula.txt
          # Fabric API est indispensable : on récupère la version déclarée dans gradle.properties.
          API=$(grep '^fabric_version=' ../gradle.properties | cut -d= -f2 | cut -d+ -f1)
          echo "Fabric API = $API"
          URL="https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API+1.21.1/fabric-api-$API+1.21.1.jar"
          curl -fsSL -o mods/fabric-api.jar "$URL" || exit 1
          cp ../mods/*.jar mods/ || true
          ls -la mods/
          sed -i 's/^online-mode=.*/online-mode=false/' server.properties 2>/dev/null || true
          printf 'online-mode=false\nlevel-type=minecraft\\:normal\nmax-world-size=1000\nspawn-protection=0\n' > server.properties

      - name: Démarrer le serveur et lire les journaux
        id: serveur
        if: steps.prep.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          cd serveur
          # On laisse tourner 4 minutes : suffisant pour charger tous les registres du mod.
          timeout 240 java -Xmx2G -jar fabric-server-launch.jar nogui > journal.txt 2>&1 || true
          echo "===== extrait du journal ====="
          tail -120 journal.txt

      - name: Vérifier le chargement du mod
        id: verif
        if: steps.prep.outcome == 'success'
        run: |
          cd serveur
          echo "=== Lignes Cambocraft ==="
          grep -i "cambocraft" journal.txt | head -40 || true
          echo "=== Erreurs fatales ==="
          grep -iE "Failed to (load|start)|Exception in thread \"main\"|Caused by|Incompatible mod set|ModResolutionException" journal.txt | head -20 || true
          python3 - <<'PY'
          import re, sys
          t = open("journal.txt", encoding="utf-8", errors="replace").read()
          ok_init = "Cambocraft : initialisation du contenu de base" in t
          ok_blocks = bool(re.search(r"Cambocraft : \d+ blocs, \d+ objets et \d+ biomes", t))
          ok_done = "Done (" in t
          crash = bool(re.search(r"Incompatible mod set|ModResolutionException|Failed to start the minecraft server", t))
          print("Initialisation du mod :", "OUI" if ok_init else "NON")
          print("Compteurs de contenu :", "OUI" if ok_blocks else "NON")
          print("Serveur prêt (Done) :", "OUI" if ok_done else "NON")
          print("Crash au démarrage :", "OUI" if crash else "non")
          with open("../serveur_resultat.txt", "w") as f:
              f.write(f"init={ok_init} compteurs={ok_blocks} done={ok_done} crash={crash}\n")
          if crash or not ok_init:
              sys.exit(1)
          PY

      - name: Publier le journal du serveur (check run)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          parts = []
          for p in ("serveur/journal.txt", "serveur_resultat.txt"):
              if os.path.exists(p):
                  parts.append("=== " + p + " ===\n" + open(p, encoding="utf-8", errors="replace").read())
          text = "\n".join(parts) or "(pas de journal serveur)"
          text = text[-55000:]
          body = {
              "name": "cambocraft-serveur-test",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "Test de démarrage du serveur", "summary": "Journal du serveur Fabric.", "text": "```\n" + text + "\n```"},
          }
          open("body2.json", "w", encoding="utf-8").write(json.dumps(body))
          subprocess.run(["gh", "api", "-X", "POST", "repos/" + os.environ["GITHUB_REPOSITORY"] + "/check-runs", "--input", "body2.json"], check=False)
          PY
