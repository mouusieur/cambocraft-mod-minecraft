name: build

# Compile le mod avec Gradle / Fabric Loom et publie le .jar en artefact.
# Les runners GitHub ont accès à maven.fabricmc.net et aux dépôts Mojang,
# ce dont l'environnement de développement hors ligne ne dispose pas.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Compiler le mod
        run: ./gradlew build --stacktrace --no-daemon

      - name: Publier le .jar
        uses: actions/upload-artifact@v4
        with:
          name: cambocraft-jar
          path: build/libs/*.jar

      - name: Liste des fichiers produits
        if: always()
        run: ls -la build/libs 2>/dev/null || true
