name: captures

# Lance un VRAI client Minecraft 1.21.1 + Fabric avec le mod, construit des scenes
# dans cambocraft:cambodia et prend de veritables captures d'ecran (touche F2).
# Le rendu est logiciel (Mesa/llvmpipe) sous Xvfb : aucun GPU n'est requis.
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Scenes a capturer (portail,cite,interieur,vegetation)"
        required: false
        default: "portail,cite,interieur,vegetation"
  push:
    # Declenchement large : permet de relancer une session de capture en poussant
    # un commit ordinaire (le dispatch manuel n'est pas disponible pour l'agent).
    paths:
      - "tools/dev/captures/**"
      - ".github/workflows/captures.yml"
      - "src/main/java/com/cambocraft/client/**"
      - "src/main/resources/assets/cambocraft/models/**"

permissions:
  contents: write
  checks: write

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-

      - name: Compiler le mod
        run: |
          chmod +x gradlew
          # Les logs du runner ne sont pas toujours accessibles a l'agent : on
          # capture la sortie de Gradle et on l'affiche en annotations de check run.
          set +e
          ./gradlew build --no-daemon --console=plain > gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=Gradle a echoue::$(grep -m 6 -E 'error:|error: |.java:[0-9]+' gradle.log | head -6 | tr '\n' '|')"
            grep -m 40 -E 'error|FAILURE|What went wrong|cannot find symbol|symbol:|location:' gradle.log || true
          fi
          exit $code

      - name: Installer le rendu logiciel et Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils \
            libxi6 libxrandr2 libxcursor1 libxinerama1 libxxf86vm1 libglfw3 xdotool libopenal1 imagemagick

      - name: Préparer le serveur dédié
        run: |
          mkdir -p "$RUNNER_TEMP/serveur"
          cd "$RUNNER_TEMP/serveur"
          curl -fsSL -o installer.jar https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.1/fabric-installer-1.0.1.jar
          java -jar installer.jar server -mcversion 1.21.1 -downloadMinecraft -dir .
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:normal\nspawn-protection=0\nmax-tick-time=-1\nsync-chunk-writes=false\n' > server.properties
          mkdir -p mods
          cp "$GITHUB_WORKSPACE/build/libs/cambocraft-1.0.0.jar" mods/
          API=$(grep '^fabric_version=' "$GITHUB_WORKSPACE/gradle.properties" | cut -d= -f2 | cut -d+ -f1)
          curl -fsSL -o mods/fabric-api.jar \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API+1.21.1/fabric-api-$API+1.21.1.jar"
          ls -la mods/

      - name: Préparer le client Minecraft
        run: |
          set -x
          python3 tools/dev/captures/client.py "$RUNNER_TEMP/client" 1.21.1 || {
            echo "::error title=client.py a echoue::code $?"; exit 1; }
          mkdir -p "$RUNNER_TEMP/client/mods"
          cp build/libs/cambocraft-1.0.0.jar "$RUNNER_TEMP/client/mods/" || {
            echo "::error title=jar du mod absent::$(ls -la build/libs 2>&1 | tr '\n' '|')"; exit 1; }
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2 | cut -d+ -f1)
          curl -fsSL -o "$RUNNER_TEMP/client/mods/fabric-api.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API+1.21.1/fabric-api-$API+1.21.1.jar" || {
            echo "::error title=fabric-api indisponible::$API+1.21.1"; exit 1; }

      - name: Installer Fabric Loader dans le client
        run: |
          cd "$RUNNER_TEMP/client"
          curl -fsSL -o installer.jar https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.1/fabric-installer-1.0.1.jar
          java -jar installer.jar client -mcversion 1.21.1 -dir . -noprofile
          echo "--- arborescence des versions ---"
          find versions -maxdepth 2 -name "*.json" | head
          echo "--- bibliotheques fabric ---"
          find libraries/net/fabricmc -name "*.jar" | head -20

      - name: Assembler le classpath Fabric
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          d = os.environ["RUNNER_TEMP"] + "/client"
          # L'installeur ecrit un profil de lancement : on lit ses bibliotheques.
          profils = [p for p in glob.glob(d + "/versions/*/*.json") if "1.21.1" in p]
          print("profils :", profils)
          jars = []
          for p in profils:
              data = json.load(open(p, encoding="utf-8"))
              for lib in data.get("libraries", []):
                  nom = lib.get("name", "")
                  # ex. net.fabricmc:intermediary:1.21.1 -> libraries/net/fabricmc/intermediary/1.21.1/intermediary-1.21.1.jar
                  groupe, artefact, version = nom.split(":")[:3]
                  chemin = os.path.join(d, "libraries", groupe.replace(".", "/"), artefact, version,
                                        f"{artefact}-{version}.jar")
                  if os.path.exists(chemin):
                      jars.append(chemin)
                  else:
                      trouve = glob.glob(os.path.join(d, "libraries", groupe.replace(".", "/"), artefact, version, "*.jar"))
                      jars.extend(trouve)
          print("jars fabric resolus :", len(jars))
          for j in jars: print("   ", os.path.relpath(j, d))
          base = open(d + "/classpath.txt", encoding="utf-8").read().strip().split(":")
          client_jar = d + "/client.jar"
          reste = [p for p in base if not p.endswith("client.jar")]
          # Les bibliotheques Fabric doivent preceder le jar client.
          final = jars + reste + [client_jar]
          open(d + "/classpath.txt", "w", encoding="utf-8").write(":".join(final))
          infos = json.load(open(d + "/infos.json", encoding="utf-8"))
          infos["main_class"] = "net.fabricmc.loader.impl.launch.knot.KnotClient"
          json.dump(infos, open(d + "/infos.json", "w", encoding="utf-8"), indent=2)
          # Verification : ASM et Mixin doivent etre la.
          for attendu in ("asm-", "sponge-mixin", "fabric-loader", "intermediary"):
              present = any(attendu in os.path.basename(p) for p in final)
              print(f"   {attendu:16s} : {'OK' if present else 'MANQUANT'}")
          PY

      - name: Capturer les écrans
        id: captures
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
          SDL_AUDIODRIVER: dummy
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.6"
          __GL_SYNC_TO_VBLANK: "0"
        run: |
          mkdir -p captures
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            python3 tools/dev/captures/captures.py \
              --client "$RUNNER_TEMP/client" \
              --serveur "$RUNNER_TEMP/serveur" \
              --sortie captures \
              --scenes "${{ github.event.inputs.scenes || 'portail,cite,interieur,vegetation' }}" \
              --largeur 1280 --hauteur 720 2>&1 | tee captures/journal.txt
          ls -la captures/

      - name: Publier les captures (check run)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, glob, json, os, subprocess
          fichiers = sorted(glob.glob("captures/*.png"))
          journal = "captures/journal.txt"
          texte = open(journal, encoding="utf-8", errors="replace").read() if os.path.exists(journal) else "(pas de journal)"
          corps = {
              "name": "cambocraft-captures",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {
                  "title": f"Captures : {len(fichiers)} image(s)",
                  "summary": ", ".join(os.path.basename(f) for f in fichiers) or "aucune image",
                  "text": "```\n" + texte[-50000:] + "\n```",
              },
          }
          open("corps.json", "w", encoding="utf-8").write(json.dumps(corps))
          subprocess.run(["gh", "api", "-X", "POST",
                          "repos/" + os.environ["GITHUB_REPOSITORY"] + "/check-runs",
                          "--input", "corps.json"], check=False)
          # Les images sont republiees dans un second check run, une par check,
          # car l'API tronque le texte a 65 535 octets : une capture 1280x720 en PNG
          # depasse ce seuil. On les decoupe donc en morceaux lisibles par l'API.
          for i, f in enumerate(fichiers):
              donnees = base64.b64encode(open(f, "rb").read()).decode()
              nom = os.path.basename(f)
              for j in range(0, len(donnees), 60000):
                  corps = {
                      "name": f"capture-{nom}-{j // 60000:03d}",
                      "head_sha": os.environ["GITHUB_SHA"],
                      "status": "completed",
                      "conclusion": "neutral",
                      "output": {
                          "title": f"{nom} (partie {j // 60000 + 1})",
                          "summary": f"{nom} | {len(donnees)} caracteres base64",
                          "text": donnees[j:j + 60000],
                      },
                  }
                  open("morceau.json", "w", encoding="utf-8").write(json.dumps(corps))
                  subprocess.run(["gh", "api", "-X", "POST",
                                  "repos/" + os.environ["GITHUB_REPOSITORY"] + "/check-runs",
                                  "--input", "morceau.json"], check=False)
              print(f"   {nom} : {len(donnees)} caracteres publies en morceaux")
          print("images encodees :", len(fichiers))
          PY

      - name: Publier les captures (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-cambocraft
          path: captures/
          if-no-files-found: warn
